name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Tests unitarios (Vitest)
        run: npm test

      - name: Build de producción
        run: npm run build

      - name: Comprobar la PWA generada
        run: |
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          test -f dist/icons/icon-maskable-512.png
          grep -q "tendeta-" dist/sw.js
          node -e "const m=JSON.parse(require('fs').readFileSync('dist/manifest.webmanifest','utf8')); if (m.start_url !== './' || m.scope !== './' || m.display !== 'standalone') process.exit(1)"

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests end-to-end (móvil y tableta)
        run: npm run e2e
        env:
          CI: 'true'

      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
